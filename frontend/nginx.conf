# SPA servisi + /api -> backend proxy.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API isteklerini backend container'ina yonlendir
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # SSE (Server-Sent Events) icin tamponlamayi kapat
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
    }

    # SPA fallback — tum yollar index.html'e
    location / {
        try_files $uri $uri/ /index.html;
    }
}
